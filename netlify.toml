[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# hashed build assets never change
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# models and posters keep their file names: a week, revalidated after
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/posters/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
